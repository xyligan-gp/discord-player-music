name: Deploy

# Builds the site from the sources of this branch and publishes it with GitHub Pages at https://dpm.js.org.
# Settings → Pages → Source must be "GitHub Actions" (the custom domain stays in the same settings).
#
# It runs on every push to this branch, by hand (Actions → Deploy → Run workflow), and when the docs of another
# branch change: the `docs-updated.yml` workflow of the stable and dev branches starts it.

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Downloads docs/index.json of every branch, prerenders it and builds the static site into out/
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
