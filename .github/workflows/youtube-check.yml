name: YouTube playback check

# YouTube changes its protection often, so playback is checked every day with the real service.
# When the check fails, an issue is opened (or commented on, if it is already open).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  youtube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install yt-dlp
      - run: npm ci
      - run: npm run test:integration

      - name: Report the failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'YouTube playback check failed';
            const body = `The daily check failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'youtube-check' });

            if (issues.data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: issues.data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['youtube-check'] });
